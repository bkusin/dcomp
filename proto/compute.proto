syntax = "proto3";
package compute;

service WorkerPool {
	rpc Register (Empty) returns (stream WorkPayload);
	rpc CompleteWork (WorkResponse) returns (Empty);
}


message WorkPayload {
	uint32 id = 1;
	string payload = 2;
}

message WorkResponse {
	uint32 id = 1;
	uint32 result = 2;
}

message Empty {
	
}